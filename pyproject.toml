[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mintmark"
version = "0.1.0"
description = "Usage rating and invoicing in integer minor units."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tesfaye" }]

[tool.setuptools.packages.find]
include = ["mintmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
